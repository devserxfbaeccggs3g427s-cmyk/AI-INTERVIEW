name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra spec Kiro
        run: npm run validate:specs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          ANTHROPIC_API_KEY: ""

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Tạo database + seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Cài Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e
        env:
          DATABASE_URL: "file:./dev.db"
          ANTHROPIC_API_KEY: ""
